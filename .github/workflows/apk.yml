name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          APPNAME="$(cat appname.txt)"
          mkdir -p www && cp index.html www/
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APPNAME" com.alrawais.mawaqii --web-dir=www
          npx cap add android
          npx cap sync android
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' $MAN
          if [ -f icon-1.png ]; then
            sudo apt-get install -y imagemagick >/dev/null
            RES=android/app/src/main/res
            rm -rf $RES/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              convert icon-1.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
              convert icon-1.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            done
          fi
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Mawaqii.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مواقعي ${{ github.run_number }}
          files: Mawaqii.apk
